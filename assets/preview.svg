<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-label="The Unstarred Museum. Zero stars. Infinite lore. Fourteen founding exhibits.">
  <rect width="1200" height="560" fill="#111410"/>
  <rect x="26" y="26" width="1148" height="508" rx="10" fill="none" stroke="#697463" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="70" y="78" font-size="20" font-weight="700" letter-spacing="3" fill="#f7f4e8">✳  THE UNSTARRED MUSEUM</text>
    <text x="1124" y="78" font-size="16" text-anchor="end" letter-spacing="2" fill="#a5b09d">VOL. 001 / 2026</text>
    <path d="M70 98H1130" stroke="#697463"/>
    <text x="69" y="192" font-size="76" font-weight="900" letter-spacing="-3" fill="#f7f4e8">ZERO STARS.</text>
    <text x="69" y="278" font-size="76" font-style="italic" font-weight="900" letter-spacing="-3" fill="#d8ed91">INFINITE LORE.</text>
    <text x="74" y="321" font-size="18" fill="#cad4c4">An affectionate archive of tiny, bewildering, extraordinary software.</text>
    <g fill="#1d241d" stroke="#65725d">
      <rect x="70" y="352" width="338" height="132" rx="6"/>
      <rect x="431" y="352" width="338" height="132" rx="6"/>
      <rect x="792" y="352" width="338" height="132" rx="6"/>
    </g>
    <g font-size="13" letter-spacing="2" fill="#c0c8b8">
      <text x="90" y="381">UM-001 / SELF-DEFEATING SOFTWARE</text>
      <text x="451" y="381">UM-004 / DISTRESSED ROBOTICS</text>
      <text x="812" y="381">UM-011 / ABSOLUTE MINIMALISM</text>
    </g>
    <g font-size="21" font-weight="700" fill="#f7f4e8">
      <text x="90" y="423">love.event.quit()</text>
      <text x="451" y="423">AAAAAAAAAHHH!</text>
      <text x="812" y="423">Object.call(null);</text>
    </g>
    <g font-size="13" fill="#a5b09d">
      <text x="90" y="457">The software leaves immediately.</text>
      <text x="451" y="457">The robot has reached its limit.</text>
      <text x="812" y="457">Installed. Accomplished nothing.</text>
    </g>
    <path d="M70 505H1130" stroke="#697463"/>
    <text x="71" y="523" font-size="13" letter-spacing="2" fill="#a5b09d">14 FOUNDING SPECIMENS · 0 STARS EACH AT INTAKE</text>
    <text x="1128" y="523" font-size="13" text-anchor="end" fill="#d8ed91">CURATED WITH AFFECTION ✳</text>
  </g>
</svg>
