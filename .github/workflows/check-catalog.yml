name: Verify museum catalog
"on":
  push:
    paths:
      - 'data/exhibits.json'
      - 'scripts/check_catalog.py'
      - '.github/workflows/check-catalog.yml'
  pull_request:
    paths:
      - 'data/exhibits.json'
      - 'scripts/check_catalog.py'
      - '.github/workflows/check-catalog.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check accession records
        run: python scripts/check_catalog.py
